<!DOCTYPE html><html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Henry Stickmin</title>
<script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial;overflow:hidden}
#s,#r{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px}
h1{font-size:28px;margin:0}
p{color:#aaa;margin:0}
button{background:#20c55a;color:#07140b;border:0;border-radius:13px;padding:16px 45px;font-size:17px;font-weight:bold}
#play{display:none}
#g{display:none;position:fixed;inset:0;background:#000}
embed{width:100%;height:100%}
#r{display:none;z-index:10;text-align:center;font-size:22px}
@media(orientation:portrait){#r{display:flex}}
</style>
</head>
<body>
<div id="s">
<h1>Henry Stickmin</h1>
<p>Play in landscape mode</p>
<button id="play" onclick="p()">PLAY GAME</button>
</div>
<div id="g"></div>
<div id="r">Please rotate your device to landscape</div>
<script>
let started=false;
function o(){
let l=matchMedia("(orientation:landscape)").matches;
r.style.display=l?"none":"flex";
play.style.display=l?"block":"none";
if(!l&&started){
g.style.display="none";
g.innerHTML="";
s.style.display="flex";
started=false;
}
}
async function p(){
if(!matchMedia("(orientation:landscape)").matches||started)return;
started=true;
try{await document.documentElement.requestFullscreen()}catch(e){}
s.style.display="none";
g.style.display="block";
g.innerHTML='<embed src="https://raw.githubusercontent.com/noracismphunkk-ctrl/emulate/refs/heads/main/henry-stickmin-escaping-the-prison.swf">';
}
window.addEventListener("resize",o);
window.addEventListener("orientationchange",o);
o();
</script>
</body>
</html>
